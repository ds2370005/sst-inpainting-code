seed: 42

data:
  patch_size: 256
  time_steps: 9
  time_interval_hours: 6
  min_temp: 0.0
  max_temp: 35.0
  anomaly_range: 5.0

training:
  epochs: 30
  batch_size: 32
  num_workers: 4
  device: cuda
  mixed_precision: false

optimizer:
  lr_generator: 1.0e-4
  lr_discriminator: 1.0e-8
  beta1: 0.5
  beta2: 0.99

loss:
  lambda_ave_rec: 10.0
  lambda_ave_adv: 0.1
  lambda_ano_rec: 10.0
  lambda_ano_adv: 0.1

paths:
  checkpoint_dir: checkpoints
  output_dir: outputs

